<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1e1e2f">
<title>Cuisson Timer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="mainApp">

  <header class="app-header">
    <h1 data-i18n="appName">Cuisson Timer</h1>
  </header>

  <!-- ===== Onglet Accueil ===== -->
  <section class="tab-panel" id="panel-home">

    <!-- Sous-vue 1 : choix du mode (affichée à chaque ouverture de l'app) -->
    <div class="mode-chooser" id="modeChooser">
      <h2 data-i18n="chooseModeTitle">Que voulez-vous cuisiner ?</h2>
      <div class="chooser-modes">
        <button class="chooser-mode-btn" data-mode="crepe">
          <span class="chooser-emoji">🥞</span>
          <span data-i18n="modeCrepe">Crêpe</span>
        </button>
        <button class="chooser-mode-btn" data-mode="pancake">
          <span class="chooser-emoji">🥯</span>
          <span data-i18n="modePancake">Pancake</span>
        </button>
        <button class="chooser-mode-btn" data-mode="gaufre">
          <span class="chooser-emoji">🧇</span>
          <span data-i18n="modeGaufre">Gaufre</span>
        </button>
      </div>
    </div>

    <!-- Sous-vue 2 : minuteur du mode choisi -->
    <div class="timer-view" id="timerView" hidden>

      <div class="timer-view-top">
        <button class="back-btn" id="backToChooserBtn" type="button">
          🏠 <span data-i18n="btnChangeRecipe">Changer de recette</span>
        </button>
        <nav class="mode-selector">
          <button class="mode-btn" data-mode="crepe" title="Crêpe">🥞</button>
          <button class="mode-btn" data-mode="pancake" title="Pancake">🥯</button>
          <button class="mode-btn" data-mode="gaufre" title="Gaufre">🧇</button>
        </nav>
      </div>

      <main class="timer-section">
        <div class="step-indicator" id="stepIndicator">Prêt à démarrer</div>

        <div class="timer-display" id="timerDisplay">00:00</div>

        <div class="settings-panel" id="settingsPanel">
          <div class="setting-row" id="face1Row">
            <label for="face1Duration" id="face1Label">Face 1 (s)</label>
            <input type="number" id="face1Duration" min="5" max="600" step="1">
          </div>
          <div class="setting-row" id="face2Row">
            <label for="face2Duration" id="face2Label">Face 2 (s)</label>
            <input type="number" id="face2Duration" min="5" max="600" step="1">
          </div>
        </div>

        <div class="controls">
          <button id="startPauseBtn" class="btn-large btn-primary" data-i18n="btnStart">Démarrer</button>
          <button id="resetFinishBtn" class="btn-large btn-secondary" data-i18n="btnFinish">Terminé</button>
        </div>

        <button id="mainActionBtn" class="btn-large btn-action" hidden>Nouvelle crêpe</button>
      </main>

      <section class="counters-section">
        <h2 id="counterTitle">Compteur</h2>
        <div class="counters-grid">
          <div class="counter-card total" id="activeCounterCard">
            <span class="counter-label" id="activeCounterLabel">🥞 Crêpes</span>
            <span class="counter-value" id="activeCounterValue">0</span>
          </div>
        </div>
        <button id="resetCounterBtn" class="btn-small" data-i18n="resetCounterBtn">Remettre le compteur à zéro</button>
      </section>

    </div>

  </section>

  <!-- ===== Onglet Recettes ===== -->
  <section class="tab-panel hidden" id="panel-recipes">
    <h2 data-i18n="recipesTitle">Recettes classiques</h2>
    <div class="servings-row">
      <label for="servingsInput" data-i18n="recipesServings">Nombre de personnes</label>
      <input type="number" id="servingsInput" min="1" max="20" value="4">
    </div>
    <div id="recipeContainer"></div>
  </section>

  <!-- ===== Onglet Réglages ===== -->
  <section class="tab-panel hidden" id="panel-settings">
    <h2 data-i18n="tabSettings">Réglages</h2>

    <div class="setting-block">
      <label data-i18n="settingsLanguage">Langue</label>
      <select id="languageSelect">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="pt">Português</option>
      </select>
    </div>

    <div class="setting-block toggle-row">
      <label data-i18n="settingsSound">Son</label>
      <label class="switch">
        <input type="checkbox" id="soundToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-block toggle-row">
      <label data-i18n="settingsVibration">Vibration</label>
      <label class="switch">
        <input type="checkbox" id="vibrationToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-block toggle-row">
      <label data-i18n="settingsDarkMode">Mode sombre</label>
      <label class="switch">
        <input type="checkbox" id="darkModeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-block">
      <label data-i18n="settingsDefaultDurations">Durées par défaut</label>
      <p class="hint-text" data-i18n="settingsDefaultDurationsHint">Modifiables directement dans l'onglet Accueil pour chaque mode.</p>
    </div>
  </section>

</div>

<!-- ===== Barre d'onglets fixée en bas ===== -->
<nav class="bottom-tabs">
  <button class="tab-btn active" data-tab="home">
    <span class="tab-icon">🏠</span>
    <span data-i18n="tabHome">Accueil</span>
  </button>
  <button class="tab-btn" data-tab="recipes">
    <span class="tab-icon">📖</span>
    <span data-i18n="tabRecipes">Recettes</span>
  </button>
  <button class="tab-btn" data-tab="settings">
    <span class="tab-icon">⚙️</span>
    <span data-i18n="tabSettings">Réglages</span>
  </button>
</nav>

<script src="translations.js"></script>
<script src="recipes.js"></script>
<script src="script.js"></script>
</body>
</html>
